[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
# Bumped together with tauri.conf.json and package.json by `mise run release <version>`.
version = "0.1.7"
edition = "2024"
rust-version = "1.100"
license = "BSD-3-Clause"
authors = ["Johannes Mueller"]
publish = false

[workspace.dependencies]
catconvert-core = { path = "crates/core" }

# Tauri and UniFFI are pinned exactly: the Tauri crate must stay in lockstep with
# @tauri-apps/cli and @tauri-apps/api, and uniffi with the future uniffi-bindgen.
# protocol-asset: the editor plays audio straight from disk (see `playback_source`).
tauri = { version = "=2.12.6", features = ["protocol-asset"] }
tauri-build = { version = "=2.7.5", features = [] }
# Official plugins, in lockstep with @tauri-apps/plugin-* in apps/desktop/package.json.
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-updater = "=2.14.1"
# Plugins without a JS package. drag's command is called from api.ts directly.
tauri-plugin-drag = "=2.1.1"
tauri-plugin-single-instance = "=2.5.5"
uniffi = "=0.32.2"

# Everything else is locked by Cargo.lock.
# The desktop app downloads the optional AI upscaler with the same HTTP client
# and TLS setup as tauri-plugin-updater (rustls with ring), so no new crates.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"
# Local date for the `{date}` placeholder in output names.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Photo metadata: EXIF reading for HEIF/WebP/TIFF, and the zlib/brotli
# streams PNG text chunks and JPEG XL boxes keep it in.
kamadak-exif = "0.6.2"
miniz_oxide = "0.9.1"
brotli-decompressor = "6.3.2"
# AI upscaling (see crates/core/src/upscale): checking downloads against the
# SHA-256s compiled into the app, and unpacking the upscaler and model zips.
# Deflate only: zip's flate2 needs a backend picked, miniz_oxide (pure Rust).
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
sha2 = "0.11.1"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2"] }
# "Replace the original" moves it to the Trash / Recycle Bin. No chrono/jiff:
# only `delete` is used.
trash = { version = "5.4.0", default-features = false, features = ["freedesktop", "coinit_apartmentthreaded"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
