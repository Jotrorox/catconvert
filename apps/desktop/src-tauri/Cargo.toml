[package]
name = "catconvert-desktop"
description = "CatConvert desktop app (Tauri shell over catconvert-core)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows (https://github.com/rust-lang/cargo/issues/8519).
# staticlib/cdylib are needed for Tauri mobile (iOS/Android) later.
name = "catconvert_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
catconvert-core.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# The release profile lives in the workspace root Cargo.toml.
