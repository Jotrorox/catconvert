# Tool versions and tasks for CatConvert.
#   mise install      install the pinned tools below
#   mise tasks        list tasks
#   mise run <task>   run a task from anywhere in the repo
#
# Rust is NOT managed by mise: rustup reads rust-toolchain.toml.

min_version = "2026.9.0"

[settings]
# Never let mise install or shim Rust here, even if a global config enables it.
disable_tools = ["rust"]

[tools]
node = "26.13.1"          # current LTS
pnpm = "12.21.0"
actionlint = "1.7.12"     # GitHub Actions linter
shellcheck = "0.11.0"     # used by actionlint for `run:` scripts

# ---------------------------------------------------------------------------
# Setup / app
# ---------------------------------------------------------------------------

[tasks.setup]
description = "Install front-end dependencies (pnpm uses --frozen-lockfile when CI=true)"
run = "pnpm install"

[tasks.dev]
description = "Run the desktop app in development mode"
depends = ["setup"]
dir = "{{config_root}}/apps/desktop"
run = "pnpm tauri dev"

[tasks.build]
description = "Build the production desktop bundle for the current OS (extra args go to `tauri build`)"
depends = ["setup"]
dir = "{{config_root}}/apps/desktop"
run = "pnpm tauri build"

[tasks.icons]
description = "Regenerate the app icons in apps/desktop/src-tauri/icons from assets/app-icon.svg"
depends = ["setup"]
dir = "{{config_root}}/apps/desktop"
run = [
  "pnpm tauri icon ../../assets/app-icon.svg",
  # Desktop-only app: drop the mobile and unused outputs `tauri icon` always writes.
  "rm -rf src-tauri/icons/android src-tauri/icons/ios src-tauri/icons/64x64.png",
]

[tasks.media-tools]
description = "Build the ffmpeg/libjxl tools the app bundles (slow; default target: this machine)"
usage = 'arg "[target]" help="Rust target triple, e.g. universal-apple-darwin"'
run = 'scripts/media-tools/build.sh "${usage_target:-$(rustc -vV | sed -n "s/^host: //p")}"'

[tasks.upscaler]
description = "Build the optional AI upscaler into target/upscaler/dist/<target> (slow; default target: this machine)"
usage = 'arg "[target]" help="Rust target triple, e.g. universal-apple-darwin"'
run = 'scripts/upscaler/build.sh "${usage_target:-$(rustc -vV | sed -n "s/^host: //p")}"'

[tasks.build-bundled]
description = "Build the desktop bundle with the tools from `mise run media-tools` inside"
depends = ["setup"]
dir = "{{config_root}}/apps/desktop"
run = "pnpm tauri build --config src-tauri/tauri.media-tools.conf.json"

[tasks.cli]
description = "Run the catconvert CLI, e.g. `mise run cli -- probe photo.jpg`"
dir = "{{cwd}}"
run = "cargo run --quiet --locked -p catconvert-cli --"

# ---------------------------------------------------------------------------
# Quality
# ---------------------------------------------------------------------------

[tasks.fmt]
description = "Format Rust and front-end code"
depends = ["setup"]
run = ["cargo fmt --all", "pnpm biome format --write ."]

[tasks.fmt-check]
description = "Check formatting without writing"
depends = ["setup"]
run = ["cargo fmt --all -- --check", "pnpm biome format ."]

[tasks.lint]
description = "Clippy (deny warnings), Biome, tsc and actionlint"
depends = ["setup"]
run = [
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "pnpm biome check .",
  "pnpm typecheck",
  "actionlint",
]

[tasks.test]
description = "Rust and front-end tests"
depends = ["setup"]
run = ["cargo test --workspace --locked", "pnpm test"]

[tasks.check]
description = "Everything CI runs: fmt-check, lint, test"
depends = ["fmt-check", "lint", "test"]

# ---------------------------------------------------------------------------
# Release
# ---------------------------------------------------------------------------

[tasks.release]
description = "Bump the version everywhere, commit and tag v<version> (push stays manual)"
usage = 'arg "<version>" help="New semver version without the v prefix, e.g. 0.2.0"'
run = 'node scripts/release.mjs "${usage_version}"'
