# Pinned sources of the optional AI upscaler (catconvert-upscaler), our build of
# realesrgan-ncnn-vulkan. Read by build.sh. Everything here is under permissive
# licenses. The Real-ESRGAN model files are not part of the build or the pack:
# the app downloads them itself from xinntao's official releases.
#
# Columns: name  version  license  url  sha256  license-files  kind
#   license is an SPDX id; several are joined with commas (all apply).
#   url "git+<repo>@<commit>" is fetched with git and checked by commit id
#   (sha256 "-"); everything else is an archive checked by its SHA-256.
#   license-files are comma-separated paths inside the unpacked tree; build.sh
#   copies them into THIRD-PARTY-LICENSES.txt.
#   kind is "source" (built for every target and packed into the source
#   archive) or "macos-binary" (a prebuilt library linked on macOS only).
#
# ncnn's full-source zip carries its submodules, among them glslang, which
# ncnn links to compile its shaders at runtime and which build.sh also builds
# as a host tool (glslangValidator) for realesrgan-ncnn-vulkan's own shaders.
# libwebp is the same release the media tools use.
#
# To update a component, change its version, url and sha256 together, check
# that the patches in patches/ still apply, then run
# `scripts/upscaler/build.sh <target>` once to confirm it still builds.

